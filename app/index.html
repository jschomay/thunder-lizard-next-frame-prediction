<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thunder Lizard, Imagined</title>
<style>
:root{--bg:#111;--fg:#ddd;--mut:#888;--line:#333;--acc:#e2a651}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:720px;padding:16px 16px 4px}
h1{margin:0;font-size:20px;letter-spacing:.02em}
.sub{color:var(--mut);margin:2px 0 0;font-size:13px}
.sub a{color:var(--acc)}
#wrap{position:relative;width:min(720px,calc(100vw - 32px));aspect-ratio:1;margin:8px 16px}
#screen{width:100%;height:100%;display:block;background:#111;border:1px solid var(--line);border-radius:4px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,10,10,.82);border-radius:4px;text-align:center;padding:16px}
#overlay[hidden]{display:none}
#overlay h2{margin:0;font-size:22px}
#overlay p{margin:0;color:#bbb;max-width:440px}
button,select{font:inherit;background:#222;color:var(--fg);border:1px solid #555;border-radius:4px;padding:5px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
#meter{position:absolute;top:6px;right:8px;font:11px/1.3 ui-monospace,monospace;color:#9f9;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:3px;pointer-events:none;text-align:right}
.bar{width:100%;max-width:720px;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px}
.bar label{display:flex;gap:6px;align-items:center}
.pad{display:none}
@media (hover:none){.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;margin:10px auto}.pad button{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>Thunder Lizard, imagined by a neural net</h1>
  <p class="sub">There is no game engine running. Every tick, a small neural net predicts the next frame. <a href="https://enegames.itch.io/thunder-lizard-eat-or-be-eaten" target="_blank" rel="noopener">See the original game here</a>.</p>
</header>
<div id="wrap">
  <canvas id="screen" width="720" height="720"></canvas>
  <div id="meter">loading…</div>
  <div id="overlay">
    <h2 id="otitle">Loading the model…</h2>
    <p id="otext">2.3 MB, runs in your browser.</p>
    <div id="obtns" hidden><button class="primary" id="go">Play</button></div>
  </div>
</div>
<div class="bar">
  <button id="restart">restart</button>
</div>
<div class="pad" id="pad">
  <span></span><button data-k="1">▲</button><span></span>
  <button data-k="4">◀</button><button data-k="3">▼</button><button data-k="2">▶</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
<script src="main.js?v=10"></script>
</body>
</html>
